apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogdb
  namespace: ecommerce-dev
spec:
  selector:
    matchLabels:
      app: catalogdb
  template:
    metadata:
      labels:
        app: catalogdb
    spec:
      containers:
      - name: catalogdb
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: POSTGRES_DB_CATALOG
        volumeMounts:
        - name: postgres-catalog-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-catalog-data
        persistentVolumeClaim:
          claimName: postgres-catalog-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: catalogdb
  namespace: ecommerce-dev
spec:
  selector:
    app: catalogdb
  ports:
  - port: 5432
    targetPort: 5432
---
