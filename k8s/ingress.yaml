# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce-dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: ecommerce.local
    http:
      paths:
      - path: /api/catalog
        pathType: Prefix
        backend:
          service:
            name: ocelot-api-gateway
            port:
              number: 80
      - path: /api/basket
        pathType: Prefix
        backend:
          service:
            name: ocelot-api-gateway
            port:
              number: 80
      - path: /api/ordering
        pathType: Prefix
        backend:
          service:
            name: ocelot-api-gateway
            port:
              number: 80
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: ocelot-api-gateway
            port:
              number: 80
      - path: /consul
        pathType: Prefix
        backend:
          service:
            name: consul
            port:
              number: 8500
