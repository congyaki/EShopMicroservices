worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Load balancing configuration for catalog service (3 instances)
    upstream catalog-upstream {
        server catalog-api-1:80 weight=1;
        server catalog-api-2:80 weight=1;
        server catalog-api-3:80 weight=1;
    }

    # Single instances for other services
    upstream auth-upstream {
        server auth-api-1:80;
    }

    upstream basket-upstream {
        server basket-api-1:80;
    }

    upstream ordering-upstream {
        server ordering-api-1:80;
    }

    # Rate limiting settings
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name nginx-gateway;

        # Status page for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # Auth service
        location /auth-service/ {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://auth-upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Catalog service (load balanced)
        location /catalog-service/ {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://catalog-upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Basket service
        location /basket-service/ {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://basket-upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Ordering service
        location /ordering-service/ {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://ordering-upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

