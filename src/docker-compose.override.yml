version: '3.4'

services:
  # DATABASE SERVICES (5000-5999)
  catalogdb:
    container_name: catalogdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "5001:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data/

  basketdb:
    container_name: basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "5002:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/data/
  
  authdb:
    container_name: authdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=AuthDb
    restart: always
    ports:
      - "5003:5432"
    volumes:
      - postgres_auth:/var/lib/postgresql/data/

  orderdb:
    container_name: orderdb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=123456@Aa
    restart: always
    ports:
      - "5004:1433"

  # INFRASTRUCTURE SERVICES (7000-7999)
  distributedcache:
    container_name: distributedcache
    restart: always
    ports:
      - "7001:6379"

  messagebroker:
    container_name: messagebroker
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "7002:5672"
      - "7003:15672"

  consul:
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    ports:
      - "7500:8500"
      - "7600:8600/udp"

  # API SERVICES
  # Catalog API instances (8000-8009, 9000-9009)
  catalog-api-1:
    container_name: catalog-api-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ServiceConfig__ServiceName=catalog-api
      - ServiceConfig__ServiceId=catalog-api-1
      - ServiceConfig__ServiceAddress=catalog-api-1
      - ServiceConfig__ServicePort=443
      - ServiceConfig__ConsulHost=consul
      - ServiceConfig__ConsulPort=8500
      - Jwt__Key=727410b36cdc4b5c8ac91011dd2083db8381aa7b07d245b787800a5e263f525a
      - Jwt__Issuer=ecommerce-identity
      - Jwt__Audience=ecommerce-api
    depends_on:
      - catalogdb
      - consul
    ports:
      - "8001:80"
      - "9001:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  catalog-api-2:
    container_name: catalog-api-2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ServiceConfig__ServiceName=catalog-api
      - ServiceConfig__ServiceId=catalog-api-2
      - ServiceConfig__ServiceAddress=catalog-api-2
      - ServiceConfig__ServicePort=443
      - ServiceConfig__ConsulHost=consul
      - ServiceConfig__ConsulPort=8500
      - Jwt__Key=727410b36cdc4b5c8ac91011dd2083db8381aa7b07d245b787800a5e263f525a
      - Jwt__Issuer=ecommerce-identity
      - Jwt__Audience=ecommerce-api
    depends_on:
      - catalogdb
      - consul
    ports:
      - "8002:80"
      - "9002:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      
  catalog-api-3:
    container_name: catalog-api-3
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ServiceConfig__ServiceName=catalog-api
      - ServiceConfig__ServiceId=catalog-api-3
      - ServiceConfig__ServiceAddress=catalog-api-3
      - ServiceConfig__ServicePort=443
      - ServiceConfig__ConsulHost=consul
      - ServiceConfig__ConsulPort=8500
      - Jwt__Key=727410b36cdc4b5c8ac91011dd2083db8381aa7b07d245b787800a5e263f525a
      - Jwt__Issuer=ecommerce-identity
      - Jwt__Audience=ecommerce-api
    depends_on:
      - catalogdb
      - consul
    ports:
      - "8003:80"
      - "9003:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  # Basket API instances (8010-8019, 9010-9019)
  basket-api-1:
    container_name: basket-api-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__Database=Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ConnectionStrings__Redis=distributedcache:6379
      - gRPCSettings__DiscountUrl=https://discount.grpc:443
      - MessageBroker__Host=amqp://ecommerce-mq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
      - ServiceConfig__ServiceName=basket-api
      - ServiceConfig__ServiceId=basket-api-1
      - ServiceConfig__ServiceAddress=basket-api-1
      - ServiceConfig__ServicePort=443
      - ServiceConfig__ConsulHost=consul
      - ServiceConfig__ConsulPort=8500
      - Jwt__Key=727410b36cdc4b5c8ac91011dd2083db8381aa7b07d245b787800a5e263f525a
      - Jwt__Issuer=ecommerce-identity
      - Jwt__Audience=ecommerce-api
    depends_on:
      - basketdb
      - distributedcache
      - discount.grpc
      - messagebroker
      - consul
    ports:
      - "8011:80"
      - "9011:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  # Discount gRPC (8020-8029, 9020-9029)
  discount.grpc:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__Database=Data Source=discountdb
      - ServiceConfig__ServiceName=discount-grpc
      - ServiceConfig__ServiceId=discount-grpc-1
      - ServiceConfig__ServiceAddress=discount.grpc
      - ServiceConfig__ServicePort=443
      - ServiceConfig__ConsulHost=consul
      - ServiceConfig__ConsulPort=8500
    depends_on:
      - consul
    ports:
      - "8021:80"
      - "9021:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  # Ordering API instances (8030-8039, 9030-9039)
  ordering-api-1:
    container_name: ordering-api-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__Database=Server=orderdb;Database=OrderDb;User Id=sa;Password=123456@Aa;Encrypt=False;TrustServerCertificate=True
      - MessageBroker__Host=amqp://ecommerce-mq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
      - FeatureManagement__OrderFullfilment=false
      - ServiceConfig__ServiceName=ordering-api
      - ServiceConfig__ServiceId=ordering-api-1
      - ServiceConfig__ServiceAddress=ordering-api-1
      - ServiceConfig__ServicePort=443
      - ServiceConfig__ConsulHost=consul
      - ServiceConfig__ConsulPort=8500
      - Jwt__Key=727410b36cdc4b5c8ac91011dd2083db8381aa7b07d245b787800a5e263f525a
      - Jwt__Issuer=ecommerce-identity
      - Jwt__Audience=ecommerce-api
    depends_on:
      - orderdb
      - messagebroker
      - consul
    ports:
      - "8031:80"
      - "9031:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  # Auth API instances (8040-8049, 9040-9049)
  auth-api-1:
    container_name: auth-api-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__Database=Server=authdb;Port=5432;Database=AuthDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ServiceConfig__ServiceName=auth-api
      - ServiceConfig__ServiceId=auth-api-1
      - ServiceConfig__ServiceAddress=auth-api-1
      - ServiceConfig__ServicePort=443
      - ServiceConfig__ConsulHost=consul
      - ServiceConfig__ConsulPort=8500
      - Jwt__Key=727410b36cdc4b5c8ac91011dd2083db8381aa7b07d245b787800a5e263f525a
      - Jwt__Issuer=ecommerce-identity
      - Jwt__Audience=ecommerce-api
    depends_on:
      - authdb
      - consul
    ports:
      - "8041:80"
      - "9041:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  # API GATEWAYS (8080-8099, 9080-9099)
  yarpapigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      - catalog-api-1
      - catalog-api-2
      - catalog-api-3
      - basket-api-1
      - ordering-api-1
      - auth-api-1
      - consul
    ports:
      - "8080:80"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  ocelotapigateway:
    container_name: ocelotapigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ServiceConfig__ServiceName=ocelot-gateway
      - ServiceConfig__ServiceId=ocelot-gateway-1
      - ServiceConfig__ServiceAddress=ocelotapigateway
      - ServiceConfig__ServicePort=443
      - ServiceConfig__ConsulHost=consul
      - ServiceConfig__ConsulPort=8500
      - Jwt__Key=727410b36cdc4b5c8ac91011dd2083db8381aa7b07d245b787800a5e263f525a
      - Jwt__Issuer=ecommerce-identity
      - Jwt__Audience=ecommerce-api
    depends_on:
      - catalog-api-1
      - catalog-api-2
      - catalog-api-3
      - basket-api-1
      - ordering-api-1
      - auth-api-1
      - consul
    ports:
      - "8090:80"
      - "9090:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
