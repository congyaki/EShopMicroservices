apiVersion: apps/v1
kind: Deployment
metadata:
  name: discount-grpc
  namespace: eshop-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: discount-grpc
  template:
    metadata:
      labels:
        app: discount-grpc
    spec:
      containers:
      - name: discount-grpc
        image: ${REGISTRY:-}discountgrpc:${TAG:-latest}
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__Database
          value: "Data Source=discount-sqlite"
        - name: ServiceConfig__ServiceName
          value: "discount-service"
        - name: ServiceConfig__ServiceAddress
          value: "http://discount-grpc"
        - name: ServiceConfig__ServicePort
          value: "80"
        # Thêm cấu hình Leader Election provider để sử dụng Kubernetes
        - name: LeaderElection__Provider
          value: "Kubernetes"
        - name: LeaderElection__ServiceName
          value: "discount-grpc"
        - name: LeaderElection__Namespace
          value: "eshop-microservices"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        # Mount ConfigMap vào container
        volumeMounts:
        - name: leader-election-config
          mountPath: /app/leader-election-config
        - name: sqlite-data
          mountPath: /app/data
      # Định nghĩa volumes  
      volumes:
      - name: leader-election-config
        configMap:
          name: leader-election-config
          items:
          - key: leader-election.json
            path: leader-election.json
          - key: discount-service.json
            path: discount-service.json
      - name: sqlite-data
        persistentVolumeClaim:
          claimName: discount-sqlite-data
---
apiVersion: v1
kind: Service
metadata:
  name: discount-grpc
  namespace: eshop-microservices
spec:
  selector:
    app: discount-grpc
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discount-sqlite-data
  namespace: eshop-microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: standard