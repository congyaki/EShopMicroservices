apiVersion: apps/v1
kind: Deployment
metadata:
  name: discount-grpc
  namespace: eshop-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discount-grpc
  template:
    metadata:
      labels:
        app: discount-grpc
    spec:
      containers:
      - name: discount-grpc
        image: duccongdo/discountgrpc:latest
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__Database
          value: "Data Source=/app/data/discountdb"
        - name: ServiceConfig__ServiceName
          value: "discount-service"
        - name: ServiceConfig__ServiceAddress
          value: "http://discount-grpc"
        - name: ServiceConfig__ServicePort
          value: "80"
        - name: Kestrel__EndpointDefaults__Protocols
          value: "Http2"
        volumeMounts:
        - name: discount-sqlite-data
          mountPath: /app/data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
        - name: discount-sqlite-data
          persistentVolumeClaim:
            claimName: discount-sqlite-data
---
apiVersion: v1
kind: Service
metadata:
  name: discount-grpc
  namespace: eshop-microservices
spec:
  selector:
    app: discount-grpc
  ports:
  - port: 80
    targetPort: 80