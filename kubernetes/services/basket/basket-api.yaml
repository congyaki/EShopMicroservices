apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: eshop-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basket-api
  template:
    metadata:
      labels:
        app: basket-api
    spec:
      containers:
      - name: basket-api
        image: ${REGISTRY:-}basketapi:${TAG:-latest}
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__Database
          value: "Host=catalog-postgres;Database=BasketDb;Username=catalog_user;Password=Catalog_P@ssw0rd"
        - name: ConnectionStrings__Redis
          value: "basket-redis:6379"
        - name: EventBusSettings__HostAddress
          value: "amqp://guest:guest@rabbitmq:5672"
        - name: JwtSettings__Key
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Key
        - name: JwtSettings__Issuer
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Issuer
        - name: JwtSettings__Audience
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Audience
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: basket-api
  namespace: eshop-microservices
spec:
  selector:
    app: basket-api
  ports:
  - port: 80
    targetPort: 80