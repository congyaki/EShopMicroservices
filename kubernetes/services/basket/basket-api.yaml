apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: eshop-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basket-api
  template:
    metadata:
      labels:
        app: basket-api
    spec:
      containers:
      - name: basket-api
        image: duccongdo/basketapi:latest
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__Redis
          value: "basket-redis:6379"
        - name: ConnectionStrings__Database
          value: "Server=basket-postgres;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true"
        - name: MessageBroker__Host
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: MessageBroker__Host
        - name: MessageBroker__UserName
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: MessageBroker__UserName
        - name: MessageBroker__Password
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: MessageBroker__Password
        - name: gRPCSettings__DiscountUrl
          value: "http://discount-grpc"
        - name: JwtSettings__Key
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Key
        - name: JwtSettings__Issuer
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Issuer
        - name: JwtSettings__Audience
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Audience
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: basket-api
  namespace: eshop-microservices
spec:
  selector:
    app: basket-api
  ports:
  - port: 80
    targetPort: 80