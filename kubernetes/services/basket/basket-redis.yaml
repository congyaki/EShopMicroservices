apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: basket-redis-pvc
  namespace: eshop-microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-redis
  namespace: eshop-microservices
spec:
  selector:
    matchLabels:
      app: basket-redis
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: basket-redis
    spec:
      containers:
      - name: redis
        image: redis:latest
        command:
        - redis-server
        - "--appendonly"
        - "yes"
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          limits:
            memory: 256Mi
            cpu: "0.3"
          requests:
            memory: 128Mi
            cpu: "0.1"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: basket-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: basket-redis
  namespace: eshop-microservices
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: basket-redis