apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: eshop-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
      - name: auth-api
        image: duccongdo/authapi:latest
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__Database
          value: "Server=auth-postgres;Port=5432;Database=AuthDb;User Id=auth_user;Password=Auth_P@ssw0rd;Include Error Detail=true"
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Key
        - name: Jwt__Issuer
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Issuer
        - name: Jwt__Audience
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Audience
        - name: Jwt__ExpiryInMinutes
          value: "30"
        - name: ServiceConfig__ServiceName
          value: "auth-api"
        - name: ServiceConfig__ServiceAddress
          value: "http://auth-api"
        - name: ServiceConfig__ServicePort
          value: "80"
        - name: IpRateLimiting__EnableEndpointRateLimiting
          value: "true"
        - name: IpRateLimiting__StackBlockedRequests
          value: "false"
        - name: IpRateLimiting__RealIpHeader
          value: "X-Real-IP"
        - name: IpRateLimiting__ClientIdHeader
          value: "X-ClientId"
        - name: IpRateLimiting__HttpStatusCode
          value: "429"
        - name: IpRateLimiting__GeneralRules__0__Endpoint
          value: "*"
        - name: IpRateLimiting__GeneralRules__0__Period
          value: "10s"
        - name: IpRateLimiting__GeneralRules__0__Limit
          value: "10"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: eshop-microservices
spec:
  selector:
    app: auth-api
  ports:
  - port: 80
    targetPort: 80