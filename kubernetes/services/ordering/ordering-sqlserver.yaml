apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ordering-sqlserver-pvc
  namespace: eshop-microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-sqlserver
  namespace: eshop-microservices
spec:
  selector:
    matchLabels:
      app: ordering-sqlserver
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ordering-sqlserver
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_SA_PASSWORD
          value: "Ordering_P@ssw0rd123"
        - name: MSSQL_PID
          value: "Express"
        ports:
        - containerPort: 1433
        volumeMounts:
        - name: sqlserver-data
          mountPath: /var/opt/mssql
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 1Gi
            cpu: "0.5"
        readinessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 20
          periodSeconds: 15
        livenessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: sqlserver-data
        persistentVolumeClaim:
          claimName: ordering-sqlserver-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ordering-sqlserver
  namespace: eshop-microservices
spec:
  ports:
  - port: 1433
    targetPort: 1433
  selector:
    app: ordering-sqlserver