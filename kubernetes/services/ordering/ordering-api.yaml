apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-api
  namespace: eshop-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ordering-api
  template:
    metadata:
      labels:
        app: ordering-api
    spec:
      containers:
      - name: ordering-api
        image: ${REGISTRY:-}orderingapi:${TAG:-latest}
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__Database
          value: "Server=ordering-sqlserver;Database=OrderDb;User Id=sa;Password=Order_P@ssw0rd;TrustServerCertificate=True"
        - name: EventBusSettings__HostAddress
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: EventBusSettings__HostAddress
        - name: JwtSettings__Key
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Key
        - name: JwtSettings__Issuer
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Issuer
        - name: JwtSettings__Audience
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Audience
        # Thêm cấu hình Leader Election provider để sử dụng Kubernetes
        - name: LeaderElection__Provider
          value: "Kubernetes"
        - name: LeaderElection__ServiceName
          value: "ordering-api"
        - name: LeaderElection__Namespace
          value: "eshop-microservices"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        # Mount ConfigMap vào container
        volumeMounts:
        - name: leader-election-config
          mountPath: /app/leader-election-config
      # Định nghĩa volumes  
      volumes:
      - name: leader-election-config
        configMap:
          name: leader-election-config
          items:
          - key: leader-election.json
            path: leader-election.json
          - key: ordering-service.json
            path: ordering-service.json
---
apiVersion: v1
kind: Service
metadata:
  name: ordering-api
  namespace: eshop-microservices
spec:
  selector:
    app: ordering-api
  ports:
  - port: 80
    targetPort: 80