apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-api
  namespace: eshop-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ordering-api
  template:
    metadata:
      labels:
        app: ordering-api
    spec:
      containers:
      - name: ordering-api
        image: duccongdo/orderingapi:latest
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__Database
          value: "Server=ordering-sqlserver,1433;Database=OrderDb;User Id=sa;Password=Ordering_P@ssw0rd123;Encrypt=False;TrustServerCertificate=True"
        - name: ServiceConfig__ServiceName
          value: "ordering-api"
        - name: ServiceConfig__ServiceAddress
          value: "http://ordering-api"
        - name: ServiceConfig__ServicePort
          value: "80"
        - name: FeatureManagement__OrderFullfilment
          value: "false"
        - name: MessageBroker__Host
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: MessageBroker__Host
        - name: MessageBroker__UserName
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: MessageBroker__UserName
        - name: MessageBroker__Password
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: MessageBroker__Password
        - name: JwtSettings__Key
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Key
        - name: JwtSettings__Issuer
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Issuer
        - name: JwtSettings__Audience
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Audience
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ordering-api
  namespace: eshop-microservices
spec:
  selector:
    app: ordering-api
  ports:
  - port: 80
    targetPort: 80