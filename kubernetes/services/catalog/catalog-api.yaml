apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: eshop-microservices
spec:
  replicas: 3  # 3 instances như đã cấu hình trong Kong
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
      - name: catalog-api
        image: ${REGISTRY:-}catalogapi:${TAG:-latest}
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: eshop-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__Database
          value: "Host=catalog-postgres;Database=CatalogDb;Username=catalog_user;Password=Catalog_P@ssw0rd"
        - name: EventBusSettings__HostAddress
          value: "amqp://guest:guest@rabbitmq:5672"
        - name: JwtSettings__Key
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Key
        - name: JwtSettings__Issuer
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Issuer
        - name: JwtSettings__Audience
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: JwtSettings__Audience
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: eshop-microservices
spec:
  selector:
    app: catalog-api
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-api-hpa
  namespace: eshop-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70