apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-api-login-ingress
  namespace: eshop-microservices
  annotations:
    konghq.com/strip-path: "true"
    kubernetes.io/ingress.class: "kong"
    konghq.com/plugins: "gateway.rate-limiting,gateway.auth-path-transformer-login,gateway.jwt-auth"
spec:
  rules:
  - http:
      paths:
      - path: /auth-service/api/Auth/login
        pathType: Exact
        backend:
          service:
            name: auth-api
            port:
              number: 80
---
