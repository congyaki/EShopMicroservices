apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election-role
  namespace: eshop-microservices
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update", "patch", "list", "watch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-election-rolebinding
  namespace: eshop-microservices
subjects:
- kind: ServiceAccount
  name: default  # Sử dụng default service account hoặc một service account riêng nếu bạn đã tạo
  namespace: eshop-microservices
roleRef:
  kind: Role
  name: leader-election-role
  apiGroup: rbac.authorization.k8s.io