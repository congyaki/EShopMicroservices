data:
  auth-db-migration.sql: |
    -- Migration script for Auth database (PostgreSQL)
    CREATE TABLE IF NOT EXISTS "Users" (
      "Id" text NOT NULL,
      "Username" text NOT NULL,
      "PasswordHash" text NOT NULL,
      "Email" text NOT NULL,
      "Roles" text NULL,
      "RefreshToken" text NULL,
      "RefreshTokenExpiryTime" timestamp with time zone NULL,
      CONSTRAINT "PK_Users" PRIMARY KEY ("Id")
    );
    
    -- Seed admin user only if not exists
    INSERT INTO "Users" ("Id", "Email", "PasswordHash", "Roles", "Username")
    SELECT '3ac493d2-576a-4bbe-add8-4cf91a7f43ea', 'admin@example.com', 
          'AQAAAAEAACcQAAAAEATuo9w7dKcnXuUMSUKYE9kw60QQFx5x1y50w2Ev+94cGinyWqCMxU2B6LtmpM7XQQ==', 
          'Admin', 'admin'
    WHERE NOT EXISTS (SELECT 1 FROM "Users" WHERE "Username" = 'admin');
    
    -- Seed regular user only if not exists  
    INSERT INTO "Users" ("Id", "Email", "PasswordHash", "Roles", "Username")
    SELECT '4bd293d2-576a-5cbe-bdd8-4cf91a7f43eb', 'user@example.com', 
          'AQAAAAEAACcQAAAAEITB0pPwidJ8VcCyLHSxR8vBFzx+3FG+L+BJmKvGUyaMr8TYTzZQX/wRrEA5poJ9BA==', 
          'User', 'user'
    WHERE NOT EXISTS (SELECT 1 FROM "Users" WHERE "Username" = 'user');
  ordering-db-migration.sql: |
    -- Migration script for Ordering database (SQL Server)
    -- Kết nối đến master database trước
    USE master;
    GO
    
    -- Đảm bảo database OrderingDb đã tồn tại
    IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'OrderingDb')
    BEGIN
        CREATE DATABASE OrderingDb;
    END
    GO
    
    -- Sử dụng database OrderingDb
    USE OrderingDb;
    GO
     
    -- Customers Table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Customers')
    BEGIN
        CREATE TABLE [Customers] (
            [Id] uniqueidentifier NOT NULL,
            [Name] nvarchar(100) NOT NULL,
            [Email] nvarchar(255) NOT NULL,
            [CreatedAt] datetime2 NULL,
            [CreatedBy] nvarchar(max) NULL,
            [LastModifiedAt] datetime2 NULL,
            [LastModifiedBy] nvarchar(max) NULL,
            CONSTRAINT [PK_Customers] PRIMARY KEY ([Id])
        );
        
        CREATE UNIQUE INDEX [IX_Customers_Email] ON [Customers]([Email]);
    END
    
    -- Products Table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Products')
    BEGIN
        CREATE TABLE [Products] (
            [Id] uniqueidentifier NOT NULL,
            [Name] nvarchar(100) NOT NULL,
            [Price] decimal(18,2) NOT NULL,
            [CreatedAt] datetime2 NULL,
            [CreatedBy] nvarchar(max) NULL,
            [LastModifiedAt] datetime2 NULL,
            [LastModifiedBy] nvarchar(max) NULL,
            CONSTRAINT [PK_Products] PRIMARY KEY ([Id])
        );
    END
    
    -- Orders Table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Orders')
    BEGIN
        CREATE TABLE [Orders] (
            [Id] uniqueidentifier NOT NULL,
            [CustomerId] uniqueidentifier NOT NULL,
            [OrderName] nvarchar(100) NOT NULL,
            [ShippingAddress_FirstName] nvarchar(50) NOT NULL,
            [ShippingAddress_LastName] nvarchar(50) NOT NULL,
            [ShippingAddress_EmailAddress] nvarchar(50) NULL,
            [ShippingAddress_AddressLine] nvarchar(180) NOT NULL,
            [ShippingAddress_Country] nvarchar(50) NOT NULL,
            [ShippingAddress_State] nvarchar(50) NOT NULL,
            [ShippingAddress_ZipCode] nvarchar(5) NOT NULL,
            [BillingAddress_FirstName] nvarchar(50) NOT NULL,
            [BillingAddress_LastName] nvarchar(50) NOT NULL,
            [BillingAddress_EmailAddress] nvarchar(50) NULL,
            [BillingAddress_AddressLine] nvarchar(180) NOT NULL,
            [BillingAddress_Country] nvarchar(50) NOT NULL,
            [BillingAddress_State] nvarchar(50) NOT NULL,
            [BillingAddress_ZipCode] nvarchar(5) NOT NULL,
            [Payment_CardName] nvarchar(50) NULL,
            [Payment_CardNumber] nvarchar(24) NOT NULL,
            [Payment_Expiration] nvarchar(10) NOT NULL,
            [Payment_CVV] nvarchar(3) NOT NULL,
            [Payment_PaymentMethod] int NOT NULL,
            [Status] nvarchar(max) NOT NULL DEFAULT ('Draft'),
            [TotalPrice] decimal(18,2) NOT NULL,
            [CreatedAt] datetime2 NULL,
            [CreatedBy] nvarchar(max) NULL,
            [LastModifiedAt] datetime2 NULL,
            [LastModifiedBy] nvarchar(max) NULL,
            CONSTRAINT [PK_Orders] PRIMARY KEY ([Id]),
            CONSTRAINT [FK_Orders_Customers_CustomerId] FOREIGN KEY ([CustomerId]) REFERENCES [Customers] ([Id]) ON DELETE CASCADE
        );
        
        CREATE INDEX [IX_Orders_CustomerId] ON [Orders]([CustomerId]);
    END
    
    -- OrderItems Table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'OrderItems')
    BEGIN
        CREATE TABLE [OrderItems] (
            [Id] uniqueidentifier NOT NULL,
            [OrderId] uniqueidentifier NOT NULL,
            [ProductId] uniqueidentifier NOT NULL,
            [Quantity] int NOT NULL,
            [Price] decimal(18,2) NOT NULL,
            [CreatedAt] datetime2 NULL,
            [CreatedBy] nvarchar(max) NULL,
            [LastModifiedAt] datetime2 NULL,
            [LastModifiedBy] nvarchar(max) NULL,
            CONSTRAINT [PK_OrderItems] PRIMARY KEY ([Id]),
            CONSTRAINT [FK_OrderItems_Orders_OrderId] FOREIGN KEY ([OrderId]) REFERENCES [Orders] ([Id]) ON DELETE CASCADE,
            CONSTRAINT [FK_OrderItems_Products_ProductId] FOREIGN KEY ([ProductId]) REFERENCES [Products] ([Id]) ON DELETE CASCADE
        );
        
        CREATE INDEX [IX_OrderItems_OrderId] ON [OrderItems]([OrderId]);
        CREATE INDEX [IX_OrderItems_ProductId] ON [OrderItems]([ProductId]);
    END
    
    -- Seed Customers data
    IF NOT EXISTS (SELECT * FROM [Customers])
    BEGIN
        INSERT INTO [Customers] ([Id], [Name], [Email], [CreatedAt], [CreatedBy])
        VALUES 
        ('11111111-1111-1111-1111-111111111111', 'John Doe', 'john.doe@example.com', GETDATE(), 'System'),
        ('22222222-2222-2222-2222-222222222222', 'Jane Smith', 'jane.smith@example.com', GETDATE(), 'System'),
        ('33333333-3333-3333-3333-333333333333', 'Robert Johnson', 'robert.johnson@example.com', GETDATE(), 'System');
    END
    
    -- Seed Products data
    IF NOT EXISTS (SELECT * FROM [Products])
    BEGIN
        INSERT INTO [Products] ([Id], [Name], [Price], [CreatedAt], [CreatedBy])
        VALUES 
        ('5334c996-8457-4cf0-815c-ed2b77c4ff61', 'Laptop', 1200.00, GETDATE(), 'System'),
        ('c67d6323-e8b1-4bdf-9a75-b0d0d2e7e914', 'Smartphone', 800.00, GETDATE(), 'System'),
        ('66666666-6666-6666-6666-666666666666', 'Headphones', 150.00, GETDATE(), 'System'),
        ('77777777-7777-7777-7777-777777777777', 'Monitor', 350.00, GETDATE(), 'System');
    END
      -- Seed Orders and OrderItems if no orders exist
    IF NOT EXISTS (SELECT * FROM [Orders])
    BEGIN
        DECLARE @CustomerId1 uniqueidentifier = '11111111-1111-1111-1111-111111111111';
        DECLARE @OrderId1 uniqueidentifier = '88888888-8888-8888-8888-888888888888';
        
        -- Use the actual Product IDs that were inserted earlier
        DECLARE @ProductId1 uniqueidentifier = '5334c996-8457-4cf0-815c-ed2b77c4ff61'; -- Laptop
        DECLARE @ProductId2 uniqueidentifier = 'c67d6323-e8b1-4bdf-9a75-b0d0d2e7e914'; -- Smartphone
        
        -- Create an order
        INSERT INTO [Orders] (
            [Id], [CustomerId], [OrderName], 
            [ShippingAddress_FirstName], [ShippingAddress_LastName], [ShippingAddress_EmailAddress], [ShippingAddress_AddressLine], [ShippingAddress_Country], [ShippingAddress_State], [ShippingAddress_ZipCode],
            [BillingAddress_FirstName], [BillingAddress_LastName], [BillingAddress_EmailAddress], [BillingAddress_AddressLine], [BillingAddress_Country], [BillingAddress_State], [BillingAddress_ZipCode],
            [Payment_CardName], [Payment_CardNumber], [Payment_Expiration], [Payment_CVV], [Payment_PaymentMethod],
            [Status], [TotalPrice], [CreatedAt], [CreatedBy]
        )
        VALUES (
            @OrderId1, @CustomerId1, 'My First Order',
            'John', 'Doe', 'john.doe@example.com', '123 Main St', 'USA', 'NY', '10001',
            'John', 'Doe', 'john.doe@example.com', '123 Main St', 'USA', 'NY', '10001',            'John Doe', '4111111111111111', '12/25', '123', 1,
            'Completed', 2000.00, GETDATE(), 'System'
        );
        
        -- Add order items with the correct Product IDs        
        INSERT INTO [OrderItems] ([Id], [OrderId], [ProductId], [Quantity], [Price], [CreatedAt], [CreatedBy])
        VALUES 
        (NEWID(), @OrderId1, @ProductId1, 1, 1200.00, GETDATE(), 'System'),
        (NEWID(), @OrderId1, @ProductId2, 1, 800.00, GETDATE(), 'System');
    END

  catalog-db-migration.sql: |
    -- Migration script for Catalog database (PostgreSQL) using Marten ORM
    
    -- Kiểm tra xem bảng mt_doc_product đã tồn tại chưa, nếu chưa thì tạo bảng
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = 'mt_doc_product') THEN
            -- Tạo bảng Marten document nếu chưa tồn tại
            CREATE TABLE mt_doc_product (
                id uuid NOT NULL PRIMARY KEY,
                data jsonb NOT NULL,
                mt_last_modified timestamp with time zone DEFAULT transaction_timestamp(),
                mt_version uuid NOT NULL DEFAULT md5(random()::text || clock_timestamp()::text)::uuid,
                mt_dotnet_type text NOT NULL
            );
            
            -- Tạo index để tìm kiếm hiệu quả trên dữ liệu JSON
            CREATE INDEX idx_mt_doc_product_name ON mt_doc_product USING gin ((data -> 'Name'));
            CREATE INDEX idx_mt_doc_product_price ON mt_doc_product USING gin ((data -> 'Price'));
            CREATE INDEX idx_mt_doc_product_category ON mt_doc_product USING gin ((data -> 'Category'));
        END IF;
    END
    $$;
    
    -- Xóa dữ liệu cũ (nếu cần) và thêm dữ liệu mới trực tiếp vào bảng Marten
    DO $$
    DECLARE
        phone_id uuid := 'b9a3a9bd-2429-4b51-b3dd-5d5fe815c29d';
        samsung_id uuid := '72dd3be5-5505-43a0-9edc-2275ea8ade4e';
        shirt_id uuid := '1286f9e6-47d4-4993-9ce2-7e4c54f02a9e';
    BEGIN
        -- Xóa dữ liệu cũ trong bảng Marten nếu có
        DELETE FROM mt_doc_product WHERE true;
        
        -- Thêm IPhone X
        INSERT INTO mt_doc_product (id, data, mt_dotnet_type)
        SELECT 
            phone_id,
            jsonb_build_object(
                'Id', phone_id,
                'Name', 'IPhone X',
                'Category', ARRAY['Electronics'],
                'Description', 'New Apple Mobile Phone',
                'ImageFile', 'product-1.png',
                'Price', 950.00
            ),
            'Catalog.API.Models.Product, Catalog.API'
        WHERE NOT EXISTS (SELECT 1 FROM mt_doc_product WHERE id = phone_id);
        
        -- Thêm Samsung S21
        INSERT INTO mt_doc_product (id, data, mt_dotnet_type)
        SELECT 
            samsung_id,
            jsonb_build_object(
                'Id', samsung_id,
                'Name', 'Samsung S21',
                'Category', ARRAY['Electronics'],
                'Description', 'New Samsung Mobile Phone',
                'ImageFile', 'product-2.png',
                'Price', 850.00
            ),
            'Catalog.API.Models.Product, Catalog.API'
        WHERE NOT EXISTS (SELECT 1 FROM mt_doc_product WHERE id = samsung_id);
        
        -- Thêm Adidas Shirt
        INSERT INTO mt_doc_product (id, data, mt_dotnet_type)
        SELECT 
            shirt_id,
            jsonb_build_object(
                'Id', shirt_id,
                'Name', 'Adidas Shirt',
                'Category', ARRAY['Clothing'],
                'Description', 'Comfortable sports shirt',
                'ImageFile', 'product-3.png',
                'Price', 60.00
            ),
            'Catalog.API.Models.Product, Catalog.API'
        WHERE NOT EXISTS (SELECT 1 FROM mt_doc_product WHERE id = shirt_id);
    END
    $$;

  discount-db-migration.sql: |
    -- Migration script for Discount database (SQLite)
    CREATE TABLE IF NOT EXISTS "Coupons" (
      "Id" INTEGER PRIMARY KEY AUTOINCREMENT,
      "ProductName" TEXT NOT NULL,
      "Description" TEXT NOT NULL,
      "Amount" INTEGER NOT NULL
    );
    
    -- Insert seed data if table is empty
    INSERT INTO Coupons (ProductName, Description, Amount)
    SELECT 'IPhone X', 'IPhone Discount', 150
    WHERE NOT EXISTS (SELECT 1 FROM Coupons WHERE ProductName = 'IPhone X');
    
    INSERT INTO Coupons (ProductName, Description, Amount)
    SELECT 'Samsung 10', 'Samsung Discount', 100
    WHERE NOT EXISTS (SELECT 1 FROM Coupons WHERE ProductName = 'Samsung 10');
    
    INSERT INTO Coupons (ProductName, Description, Amount)
    SELECT 'Quạt điện', 'Quạt điện Discount', 50
    WHERE NOT EXISTS (SELECT 1 FROM Coupons WHERE ProductName = 'Quạt điện');

  run-migrations.sh: |
    #!/bin/bash
    set -e

    echo "Starting database migrations and seed data process..."

    # Hàm kiểm tra kết nối và retry
    function wait_for_connection() {
        local max_attempts=10
        local attempt=1
        local cmd=$1
        local message=$2
        
        echo "$message"
        
        while [ $attempt -le $max_attempts ]; do
            if eval $cmd; then
                echo "Connection successful!"
                return 0
            fi
            
            echo "Attempt $attempt of $max_attempts failed, retrying in 5 seconds..."
            sleep 5
            ((attempt++))
        done
        
        echo "Failed to connect after $max_attempts attempts"
        return 1
    }

    # Wait for all databases to be ready with retry logic
    wait_for_connection "PGPASSWORD=Auth_P@ssw0rd pg_isready -h auth-postgres -U auth_user -d AuthDb -t 10" "Waiting for Auth Postgres database..."
      wait_for_connection "PGPASSWORD=Catalog_P@ssw0rd pg_isready -h catalog-postgres -U catalog_user -d CatalogDb -t 10" "Waiting for Catalog Postgres database..."
    
    wait_for_connection "/opt/mssql-tools/bin/sqlcmd -S ordering-sqlserver -U sa -P Ordering_P@ssw0rd123 -Q \"SELECT 1\" -C -t 10" "Waiting for Ordering SQL Server database..."

    # Check if Discount SQLite file exists, if not create it
    mkdir -p /app/discount-data
    touch /app/discount-data/discountdb
    
    # Run Auth DB Migrations
    echo "Running Auth DB migrations..."
    PGPASSWORD=Auth_P@ssw0rd psql -h auth-postgres -U auth_user -d AuthDb -a -f /scripts/auth-db-migration.sql
    
    # Run Catalog DB Migrations
    echo "Running Catalog DB migrations..."
    PGPASSWORD=Catalog_P@ssw0rd psql -h catalog-postgres -U catalog_user -d CatalogDb -a -f /scripts/catalog-db-migration.sql    # Run Ordering DB Migrations
    echo "Running Ordering DB migrations..."
    /opt/mssql-tools/bin/sqlcmd -S ordering-sqlserver -U sa -P Ordering_P@ssw0rd123 -i /scripts/ordering-db-migration.sql -C
    
    # Run Discount DB Migrations
    echo "Running Discount DB migrations..."
    sqlite3 /app/discount-data/discountdb < /scripts/discount-db-migration.sql
    
    echo "All database migrations and seed data completed successfully!"