apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migrations-config
  namespace: eshop-microservices
data:
  auth-db-migration.sql: |
    -- Migration script for Auth database (PostgreSQL)
    CREATE TABLE IF NOT EXISTS "Users" (
      "Id" text NOT NULL,
      "Username" text NOT NULL,
      "PasswordHash" text NOT NULL,
      "Email" text NOT NULL,
      "Roles" text NULL,
      "RefreshToken" text NULL,
      "RefreshTokenExpiryTime" timestamp with time zone NULL,
      CONSTRAINT "PK_Users" PRIMARY KEY ("Id")
    );
    
    -- Seed admin user only if not exists
    INSERT INTO "Users" ("Id", "Email", "PasswordHash", "Roles", "Username")
    SELECT '3ac493d2-576a-4bbe-add8-4cf91a7f43ea', 'admin@example.com', 
          'AQAAAAEAACcQAAAAEATuo9w7dKcnXuUMSUKYE9kw60QQFx5x1y50w2Ev+94cGinyWqCMxU2B6LtmpM7XQQ==', 
          'Admin', 'admin'
    WHERE NOT EXISTS (SELECT 1 FROM "Users" WHERE "Username" = 'admin');
    
    -- Seed regular user only if not exists  
    INSERT INTO "Users" ("Id", "Email", "PasswordHash", "Roles", "Username")
    SELECT '4bd293d2-576a-5cbe-bdd8-4cf91a7f43eb', 'user@example.com', 
          'AQAAAAEAACcQAAAAEITB0pPwidJ8VcCyLHSxR8vBFzx+3FG+L+BJmKvGUyaMr8TYTzZQX/wRrEA5poJ9BA==', 
          'User', 'user'
    WHERE NOT EXISTS (SELECT 1 FROM "Users" WHERE "Username" = 'user');

  ordering-db-migration.sql: |
    -- Migration script for Ordering database (SQL Server)
    -- Đảm bảo database OrderingDb đã tồn tại
    IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'OrderingDb')
    BEGIN
        CREATE DATABASE OrderingDb;
    END
    
    USE OrderingDb;
    GO
     
    -- Customers Table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Customers')
    BEGIN
        CREATE TABLE [Customers] (
            [Id] uniqueidentifier NOT NULL,
            [Name] nvarchar(100) NOT NULL,
            [Email] nvarchar(255) NOT NULL,
            [CreatedAt] datetime2 NULL,
            [CreatedBy] nvarchar(max) NULL,
            [LastModifiedAt] datetime2 NULL,
            [LastModifiedBy] nvarchar(max) NULL,
            CONSTRAINT [PK_Customers] PRIMARY KEY ([Id])
        );
        
        CREATE UNIQUE INDEX [IX_Customers_Email] ON [Customers]([Email]);
    END
    
    -- Products Table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Products')
    BEGIN
        CREATE TABLE [Products] (
            [Id] uniqueidentifier NOT NULL,
            [Name] nvarchar(100) NOT NULL,
            [Price] decimal(18,2) NOT NULL,
            [CreatedAt] datetime2 NULL,
            [CreatedBy] nvarchar(max) NULL,
            [LastModifiedAt] datetime2 NULL,
            [LastModifiedBy] nvarchar(max) NULL,
            CONSTRAINT [PK_Products] PRIMARY KEY ([Id])
        );
    END
    
    -- Orders Table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Orders')
    BEGIN
        CREATE TABLE [Orders] (
            [Id] uniqueidentifier NOT NULL,
            [CustomerId] uniqueidentifier NOT NULL,
            [OrderName] nvarchar(100) NOT NULL,
            [ShippingAddress_FirstName] nvarchar(50) NOT NULL,
            [ShippingAddress_LastName] nvarchar(50) NOT NULL,
            [ShippingAddress_EmailAddress] nvarchar(50) NULL,
            [ShippingAddress_AddressLine] nvarchar(180) NOT NULL,
            [ShippingAddress_Country] nvarchar(50) NOT NULL,
            [ShippingAddress_State] nvarchar(50) NOT NULL,
            [ShippingAddress_ZipCode] nvarchar(5) NOT NULL,
            [BillingAddress_FirstName] nvarchar(50) NOT NULL,
            [BillingAddress_LastName] nvarchar(50) NOT NULL,
            [BillingAddress_EmailAddress] nvarchar(50) NULL,
            [BillingAddress_AddressLine] nvarchar(180) NOT NULL,
            [BillingAddress_Country] nvarchar(50) NOT NULL,
            [BillingAddress_State] nvarchar(50) NOT NULL,
            [BillingAddress_ZipCode] nvarchar(5) NOT NULL,
            [Payment_CardName] nvarchar(50) NULL,
            [Payment_CardNumber] nvarchar(24) NOT NULL,
            [Payment_Expiration] nvarchar(10) NOT NULL,
            [Payment_CVV] nvarchar(3) NOT NULL,
            [Payment_PaymentMethod] int NOT NULL,
            [Status] nvarchar(max) NOT NULL DEFAULT ('Draft'),
            [TotalPrice] decimal(18,2) NOT NULL,
            [CreatedAt] datetime2 NULL,
            [CreatedBy] nvarchar(max) NULL,
            [LastModifiedAt] datetime2 NULL,
            [LastModifiedBy] nvarchar(max) NULL,
            CONSTRAINT [PK_Orders] PRIMARY KEY ([Id]),
            CONSTRAINT [FK_Orders_Customers_CustomerId] FOREIGN KEY ([CustomerId]) REFERENCES [Customers] ([Id]) ON DELETE CASCADE
        );
        
        CREATE INDEX [IX_Orders_CustomerId] ON [Orders]([CustomerId]);
    END
    
    -- OrderItems Table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'OrderItems')
    BEGIN
        CREATE TABLE [OrderItems] (
            [Id] uniqueidentifier NOT NULL,
            [OrderId] uniqueidentifier NOT NULL,
            [ProductId] uniqueidentifier NOT NULL,
            [Quantity] int NOT NULL,
            [Price] decimal(18,2) NOT NULL,
            [CreatedAt] datetime2 NULL,
            [CreatedBy] nvarchar(max) NULL,
            [LastModifiedAt] datetime2 NULL,
            [LastModifiedBy] nvarchar(max) NULL,
            CONSTRAINT [PK_OrderItems] PRIMARY KEY ([Id]),
            CONSTRAINT [FK_OrderItems_Orders_OrderId] FOREIGN KEY ([OrderId]) REFERENCES [Orders] ([Id]) ON DELETE CASCADE,
            CONSTRAINT [FK_OrderItems_Products_ProductId] FOREIGN KEY ([ProductId]) REFERENCES [Products] ([Id]) ON DELETE CASCADE
        );
        
        CREATE INDEX [IX_OrderItems_OrderId] ON [OrderItems]([OrderId]);
        CREATE INDEX [IX_OrderItems_ProductId] ON [OrderItems]([ProductId]);
    END
    
    -- Seed Customers data
    IF NOT EXISTS (SELECT * FROM [Customers])
    BEGIN
        INSERT INTO [Customers] ([Id], [Name], [Email], [CreatedAt], [CreatedBy])
        VALUES 
        ('11111111-1111-1111-1111-111111111111', 'John Doe', 'john.doe@example.com', GETDATE(), 'System'),
        ('22222222-2222-2222-2222-222222222222', 'Jane Smith', 'jane.smith@example.com', GETDATE(), 'System'),
        ('33333333-3333-3333-3333-333333333333', 'Robert Johnson', 'robert.johnson@example.com', GETDATE(), 'System');
    END
    
    -- Seed Products data
    IF NOT EXISTS (SELECT * FROM [Products])
    BEGIN
        INSERT INTO [Products] ([Id], [Name], [Price], [CreatedAt], [CreatedBy])
        VALUES 
        ('44444444-4444-4444-4444-444444444444', 'Laptop', 1200.00, GETDATE(), 'System'),
        ('55555555-5555-5555-5555-555555555555', 'Smartphone', 800.00, GETDATE(), 'System'),
        ('66666666-6666-6666-6666-666666666666', 'Headphones', 150.00, GETDATE(), 'System'),
        ('77777777-7777-7777-7777-777777777777', 'Monitor', 350.00, GETDATE(), 'System');
    END
    
    -- Seed Orders and OrderItems if no orders exist
    IF NOT EXISTS (SELECT * FROM [Orders])
    BEGIN
        DECLARE @CustomerId1 uniqueidentifier = '11111111-1111-1111-1111-111111111111';
        DECLARE @OrderId1 uniqueidentifier = '88888888-8888-8888-8888-888888888888';
        DECLARE @ProductId1 uniqueidentifier = '44444444-4444-4444-4444-444444444444';
        DECLARE @ProductId2 uniqueidentifier = '55555555-5555-5555-5555-555555555555';
        
        -- Create an order
        INSERT INTO [Orders] (
            [Id], [CustomerId], [OrderName], 
            [ShippingAddress_FirstName], [ShippingAddress_LastName], [ShippingAddress_EmailAddress], [ShippingAddress_AddressLine], [ShippingAddress_Country], [ShippingAddress_State], [ShippingAddress_ZipCode],
            [BillingAddress_FirstName], [BillingAddress_LastName], [BillingAddress_EmailAddress], [BillingAddress_AddressLine], [BillingAddress_Country], [BillingAddress_State], [BillingAddress_ZipCode],
            [Payment_CardName], [Payment_CardNumber], [Payment_Expiration], [Payment_CVV], [Payment_PaymentMethod],
            [Status], [TotalPrice], [CreatedAt], [CreatedBy]
        )
        VALUES (
            @OrderId1, @CustomerId1, 'My First Order',
            'John', 'Doe', 'john.doe@example.com', '123 Main St', 'USA', 'NY', '10001',
            'John', 'Doe', 'john.doe@example.com', '123 Main St', 'USA', 'NY', '10001',
            'John Doe', '4111111111111111', '12/25', '123', 1,
            'Paid', 2000.00, GETDATE(), 'System'
        );
        
        -- Add order items
        INSERT INTO [OrderItems] ([Id], [OrderId], [ProductId], [Quantity], [Price], [CreatedAt], [CreatedBy])
        VALUES 
        (NEWID(), @OrderId1, @ProductId1, 1, 1200.00, GETDATE(), 'System'),
        (NEWID(), @OrderId1, @ProductId2, 1, 800.00, GETDATE(), 'System');
    END

  catalog-db-migration.sql: |
    -- Migration script for Catalog database (PostgreSQL)
    CREATE TABLE IF NOT EXISTS "Products" (
      "Id" uuid NOT NULL,
      "Name" varchar(100) NOT NULL,
      "Description" text NULL,
      "Price" decimal(18,2) NOT NULL,
      "CategoryId" uuid NOT NULL,
      "ImageFile" varchar(255) NULL,
      "CreatedAt" timestamp with time zone NULL,
      CONSTRAINT "PK_Products" PRIMARY KEY ("Id")
    );
    
    CREATE TABLE IF NOT EXISTS "Categories" (
      "Id" uuid NOT NULL,
      "Name" varchar(100) NOT NULL,
      CONSTRAINT "PK_Categories" PRIMARY KEY ("Id")
    );
    
    -- Seed Categories if empty
    INSERT INTO "Categories" ("Id", "Name")
    SELECT 'c9d4c053-49b6-410c-bc78-2d54a9991870'::uuid, 'Electronics'
    WHERE NOT EXISTS (SELECT 1 FROM "Categories" WHERE "Name" = 'Electronics');
    
    INSERT INTO "Categories" ("Id", "Name")
    SELECT '3d490a70-94ce-4d15-9494-5248280c2ce3'::uuid, 'Clothing'
    WHERE NOT EXISTS (SELECT 1 FROM "Categories" WHERE "Name" = 'Clothing');
    
    -- Seed Products if empty
    INSERT INTO "Products" ("Id", "Name", "Description", "Price", "CategoryId", "ImageFile", "CreatedAt")
    SELECT 'b9a3a9bd-2429-4b51-b3dd-5d5fe815c29d'::uuid, 'IPhone X', 'New Apple Mobile Phone', 950.00, 'c9d4c053-49b6-410c-bc78-2d54a9991870'::uuid, 'product-1.png', CURRENT_TIMESTAMP
    WHERE NOT EXISTS (SELECT 1 FROM "Products" WHERE "Name" = 'IPhone X');
    
