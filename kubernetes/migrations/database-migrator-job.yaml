apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrator-job
  namespace: eshop-microservices
spec:
  ttlSecondsAfterFinished: 3600  # Giữ job trong 1 giờ sau khi hoàn thành
  template:
    spec:
      containers:
      - name: db-migrator
        image: debian:bullseye-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Cài đặt các công cụ cần thiết
          echo "Installing required tools..."
          apt-get update
          apt-get install -y wget curl gnupg2 lsb-release sqlite3 postgresql-client
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
          echo "deb [arch=amd64] https://packages.microsoft.com/debian/11/prod bullseye main" > /etc/apt/sources.list.d/mssql-release.list
          apt-get update
          ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
          echo "Tools installed successfully"
          export PATH="$PATH:/opt/mssql-tools/bin"
          
          # Thực thi migration script
          echo "Starting migrations..."
          chmod +x /scripts/run-migrations.sh
          /scripts/run-migrations.sh
        volumeMounts:
        - name: scripts-volume
          mountPath: /scripts
        - name: discount-volume
          mountPath: /app/discount-data
      volumes:
      - name: scripts-volume
        configMap:
          name: db-migrations-config
          defaultMode: 0755
      - name: discount-volume
        persistentVolumeClaim:
          claimName: discount-sqlite-data
      restartPolicy: Never
  backoffLimit: 2  # Số lần thử lại tối đa